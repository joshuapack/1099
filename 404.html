<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | 1099 XML Generator</title>
    <link rel="stylesheet" href="/style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .not-found { text-align: center; padding: 60px 30px; }
        .not-found .code { font-size: 5rem; line-height: 1; margin-bottom: 16px; }
        .not-found p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 32px; }
        .not-found .btn-download { display: inline-flex; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card not-found animate-in">
            <h1 class="code">404</h1>
            <h2>Page not found</h2>
            <p>The page you're looking for doesn't exist or has moved.</p>
            <a href="/" class="btn-download">Back to the 1099 Generator</a>
        </div>
    </div>
</body>
</html>
